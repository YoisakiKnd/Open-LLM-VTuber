appId: com.electron.app
productName: open-llm-vtuber-electron
directories:
  buildResources: resources
  output: release/${version}
files:
  - 'dist/**/*'
  - 'out/**/*'
  - 'resources/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources/runtime
    to: runtime
  - from: out/renderer
    to: frontend
  - from: ../../live2d-models
    to: live2d-models
  - from: ../../backgrounds
    to: backgrounds
  - from: ../../avatars
    to: avatars
  - from: ../../web_tool
    to: web_tool
  - from: ../../characters
    to: characters
  - from: ../../config_templates/conf.default.yaml
    to: conf.yaml
  - from: ../../model_dict.json
    to: model_dict.json
  - from: ../../LICENSE
    to: licenses/Open-LLM-VTuber-LICENSE
  - from: ../../LICENSE-Live2D.md
    to: licenses/Live2D-Cubism-LICENSE.md
asarUnpack:
  - resources/**
win:
  executableName: open-llm-vtuber-electron
  icon: resources/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  differentialPackage: false
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
  writeUpdateInfo: false
linux:
  executableName: open-llm-vtuber-electron
  icon: resources/icon.png
  category: Utility
  synopsis: Desktop client for Open-LLM-VTuber
  maintainer: electronjs.org
  target:
    - AppImage
    - snap
    - deb
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  releaseType: release
  publishAutoUpdate: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/