name: Desktop Baseline

on:
  push:
    paths:
      - "apps/desktop/**"
      - "rust-gateway/**"
      - "frontend"
      - "backgrounds/**"
      - "avatars/**"
      - "characters/**"
      - "live2d-models/**"
      - "web_tool/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "rust-gateway/**"
      - "frontend"
      - "backgrounds/**"
      - "avatars/**"
      - "characters/**"
      - "live2d-models/**"
      - "web_tool/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder: --linux
            unpackedDir: linux-unpacked
            runtimeBinary: rust-gateway
            verify: |
              test -x release/1.2.1/linux-unpacked/resources/runtime/rust-gateway
          - os: windows-latest
            builder: --win
            unpackedDir: win-unpacked
            runtimeBinary: rust-gateway.exe
            verify: |
              powershell -NoProfile -Command "if (-not (Test-Path 'release/1.2.1/win-unpacked/resources/runtime/rust-gateway.exe')) { exit 1 }"
          - os: macos-latest
            builder: --mac
            unpackedDir: mac
            runtimeBinary: rust-gateway
            verify: |
              test -x release/1.2.1/mac/open-llm-vtuber-electron.app/Contents/Resources/runtime/rust-gateway
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Runtime
        working-directory: .
        run: cargo build --manifest-path rust-gateway/Cargo.toml --release --locked

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check Electron build configuration
        run: npm run typecheck:node

      - name: Type-check settings compatibility
        run: npm run typecheck:settings

      - name: Test settings compatibility
        run: npm test

      - name: Build web renderer
        run: npm run build:web

      - name: Prepare packaged Rust Runtime
        run: npm run prepare:runtime

      - name: Build Electron application
        run: npm run build

      - name: Build unpacked desktop application
        run: npx electron-builder --dir ${{ matrix.builder }}

      - name: Verify packaged Rust Runtime
        shell: bash
        run: ${{ matrix.verify }}
